[General]
Autosave = 0
DisplayPerfInTitle = 1
ExtendedAspectRatio = 4:3, extend_y
DisableFrameDelay = 1

[Graphics]
WindowScale = 3
Fullscreen = 0
EnhancedMode7 = 1
NewRenderer = 1
IgnoreAspectRatio = 1
NoSpriteLimits = 1
LinearFiltering = 0
OutputMethod = OpenGL
Shader = glsl-shaders/scalehq/4xScaleHQ.glslp
DimFlashes = 0
FpsCounter = 0
Vsync = 1

[Sound]
EnableAudio = 1
AudioFreq = 44100
AudioChannels = 2
AudioSamples = 2048
MSUVolume = 100

[Features]
ItemSwitchLR = 1
TurnWhileDashing = 1
MirrorToDarkworld = 0
SkipIntroOnKeypress = 0
CarryMoreRupees = 0
MiscBugFixes = 1
DisableLowHealthBeep = 0

[Cheats]
InfiniteHealth = yes
InfiniteMagic = yes
InfiniteBombs = yes
InfiniteArrows = yes
InfiniteKeys = yes
InfiniteRupees = yes
WalkWall = no

[KeyMap]
Controls = W,S,A,D,B,N,L,K,I,J,E,U
Load = :,;,<,=,>,?,@,C
Save = Shift+:,Shift+;,Shift+<,Shift+=,Shift+>,Shift+?,Shift+@,Shift+A,Shift+B,Shift+C
Replay = Ctrl+:,Ctrl+;,Ctrl+<,Ctrl+=,Ctrl+>,Ctrl+?,Ctrl+@,Ctrl+A,Ctrl+B,Ctrl+C
CheatKeys = O
CheatEquipment = Shift+W
CheatWalkThroughWalls = Ctrl+E
Fullscreen = Alt+Return
Reset = Ctrl+R
Pause = Shift+P
PauseDimmed = P
Turbo = Tab
ReplayTurbo = T
DisplayPerf = F
ToggleRenderer = R
Settings = Escape
