name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build-macos:
    name: macOS x86_64
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: brew install sdl2
    - name: Build
      run: make -j$(sysctl -n hw.logicalcpu)
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: zelda3-macos-x86_64
        path: |
          zelda3
          zelda3.ini
        if-no-files-found: error

  build-linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install system deps
      run: sudo apt update && sudo apt install -y libsdl2-dev wget file
    - name: Install Python deps
      run: pip install pillow pyyaml
    - name: Build
      run: make -j$(nproc)
    - name: Bundle Python deps and extraction scripts
      run: |
        # Copy system-installed packages (with C extensions) into AppDir
        SITE_PKGS=$(python3 -c "import site; print(site.getsitepackages()[0])")
        mkdir -p AppDir/python-deps
        cp -r "$SITE_PKGS/yaml" AppDir/python-deps/yaml
        cp -r "$SITE_PKGS/_yaml" AppDir/python-deps/ 2>/dev/null || true
        cp -r "$SITE_PKGS/PIL" AppDir/python-deps/PIL
        cp -r "$SITE_PKGS/Pillow"* AppDir/python-deps/ 2>/dev/null || true
        cp assets/restool.py AppDir/
        cp -r assets AppDir/
    - name: Bundle AppImage
      run: |
        cp zelda3 AppDir/
        cp zelda3.ini AppDir/
        chmod +x AppDir/zelda3
        wget -qO appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool
        chmod +x AppDir/AppRun
        ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir zelda3-linux-x86_64.AppImage
        chmod +x zelda3-linux-x86_64.AppImage
    - name: Upload AppImage
      uses: actions/upload-artifact@v4
      with:
        name: zelda3-linux-x86_64
        path: zelda3-linux-x86_64.AppImage
        if-no-files-found: error

