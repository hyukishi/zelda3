name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build-macos:
    name: macOS x86_64
    runs-on: macos-13
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: brew install sdl2
    - name: Build
      run: make -j$(sysctl -n hw.logicalcpu)
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: zelda3-macos-x86_64
        path: |
          zelda3
          zelda3.ini
        if-no-files-found: error

  build-linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
    - name: Install system deps
      run: |
        sudo apt update
        sudo apt install -y build-essential libsdl2-dev python3 python3-pip python3-venv wget file patchelf
    - name: Install Python deps
      run: pip3 install --no-cache-dir pillow pyyaml
    - name: Build
      run: make -j$(nproc)
    - name: Bundle extraction scripts
      run: |
        cp assets/restool.py AppDir/
        cp -r assets AppDir/
        cp -r other AppDir/
    - name: Bundle AppImage
      run: |
        rm -f AppDir/glsl-shaders AppDir/sprites-gfx
        cp -r glsl-shaders AppDir/
        [ -d sprites-gfx ] && cp -r sprites-gfx AppDir/ || true
        cp zelda3 AppDir/
        mkdir -p AppDir/usr/lib
        cp -L /usr/lib/x86_64-linux-gnu/libSDL2-2.0.so.0 AppDir/usr/lib/
        patchelf --set-rpath '$ORIGIN/../lib' AppDir/zelda3
        chmod +x AppDir/zelda3
        wget -qO appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool
        chmod +x AppDir/AppRun
        ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir zelda3-linux-x86_64.AppImage
        chmod +x zelda3-linux-x86_64.AppImage
    - name: Upload AppImage
      uses: actions/upload-artifact@v4
      with:
        name: zelda3-linux-x86_64
        path: zelda3-linux-x86_64.AppImage
        if-no-files-found: error

  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v3
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-SDL2
          mingw-w64-x86_64-python
          mingw-w64-x86_64-python-pip
          mingw-w64-x86_64-python-pillow
          make
    - name: Install Python deps
      run: pip install --break-system-packages PyYAML
    - name: Build
      run: make -j$(nproc)
    - name: Fetch glsl-shaders
      run: |
        pacman -S --noconfirm --needed git
        git clone --depth 1 --filter=blob:none --sparse https://github.com/libretro/glsl-shaders.git _shaders_tmp
        cd _shaders_tmp
        git sparse-checkout set presets scalefx xbr xbrz sharpen sabr nnedi3 scalehq shaders anti-aliasing
        cd ..
        cp -r _shaders_tmp/* glsl-shaders/
        rm -rf _shaders_tmp
    - name: Bundle for distribution
      run: |
        mkdir -p dist/zelda3-windows
        cp zelda3.exe zelda3.ini dist/zelda3-windows/
        cp -r assets other glsl-shaders dist/zelda3-windows/
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: zelda3-windows-x86_64
        path: |
          dist/zelda3-windows/**
        if-no-files-found: error

